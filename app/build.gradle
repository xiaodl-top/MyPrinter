plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ---------------------------------------------------------------------------
// 本机私有配置（不提交）
//
// 打印服务地址、打印机名称、验证口令刻意不放在仓库里。构建时按以下顺序读取：
//   1. Gradle 属性：-PDEFAULT_API_URL=...  或 ~/.gradle/gradle.properties
//   2. local.properties（已被 .gitignore 忽略，模板见 local.properties.example）
//   3. 同名的进程环境变量
// 并写入 BuildConfig。缺失时值为空字符串，工程仍可正常构建，
// 只是首次启动会引导用户去设置页填写。
// ---------------------------------------------------------------------------
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def secretDefault = { String key ->
    def value = project.findProperty(key) ?: localProperties.getProperty(key) ?: System.getenv(key) ?: ''
    // 转义为生成的 Java 字符串字面量。
    value.replace('\\', '\\\\').replace('"', '\\"')
}

if (!project.findProperty('DEFAULT_API_URL')
        && !localProperties.getProperty('DEFAULT_API_URL')
        && !System.getenv('DEFAULT_API_URL')) {
    logger.warn('MyPrinter: DEFAULT_API_URL is not configured. The app will start with an ' +
            'empty print service URL; set it in local.properties (see local.properties.example).')
}

android {
    namespace 'top.xiaodl.myprinter'
    compileSdk 35

    defaultConfig {
        applicationId 'top.xiaodl.myprinter'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName 'v2.0'

        // 敏感默认值：构建时从 local.properties / 环境变量注入。
        buildConfigField "String", "DEFAULT_API_URL", "\"${secretDefault('DEFAULT_API_URL')}\""
        buildConfigField "String", "DEFAULT_PRINTER", "\"${secretDefault('DEFAULT_PRINTER')}\""
        buildConfigField "String", "DEFAULT_CODE", "\"${secretDefault('DEFAULT_CODE')}\""
    }

    signingConfigs {
        yshaw {
            keyAlias 'key0'
            keyPassword '123456'
            storeFile file('../../yshaw.jks')
            storePassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.yshaw
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.yshaw
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true // 默认关闭了BuildConfig生成，需要手动开启
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    applicationVariants.all { variant ->
        def buildTime = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('GMT+08:00'))
        variant.outputs.each { output ->
            output.outputFileName = "MyPrinter-${versionName}-${versionCode}-${output.baseName}-${buildTime}.apk"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

