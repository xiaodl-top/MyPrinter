plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ---------------------------------------------------------------------------
// Machine-local secrets
//
// The print service URL, printer name and access code are deliberately NOT in
// this repository. They are read at build time from (in order):
//   1. a Gradle property:   -PDEFAULT_API_URL=...  or  ~/.gradle/gradle.properties
//   2. local.properties     (already git-ignored; see local.properties.example)
//   3. the process environment variable of the same name
// and baked into BuildConfig. When a value is missing it becomes an empty
// string, so the app still builds and simply asks the user to fill in settings.
// ---------------------------------------------------------------------------
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def secretDefault = { String key ->
    def value = project.findProperty(key) ?: localProperties.getProperty(key) ?: System.getenv(key) ?: ''
    // Escape the value for the generated Java string literal.
    value.replace('\\', '\\\\').replace('"', '\\"')
}

if (!project.findProperty('DEFAULT_API_URL')
        && !localProperties.getProperty('DEFAULT_API_URL')
        && !System.getenv('DEFAULT_API_URL')) {
    logger.warn('MyPrinter: DEFAULT_API_URL is not configured. The app will start with an ' +
            'empty print service URL; set it in local.properties (see local.properties.example).')
}

android {
    namespace 'top.xiaodl.myprinter'
    compileSdk 35

    defaultConfig {
        applicationId 'top.xiaodl.myprinter'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName 'v2.0'

        // Sensitive defaults, injected from local.properties / environment at build time.
        buildConfigField "String", "DEFAULT_API_URL", "\"${secretDefault('DEFAULT_API_URL')}\""
        buildConfigField "String", "DEFAULT_PRINTER", "\"${secretDefault('DEFAULT_PRINTER')}\""
        buildConfigField "String", "DEFAULT_CODE", "\"${secretDefault('DEFAULT_CODE')}\""
    }

    signingConfigs {
        yshaw {
            keyAlias 'key0'
            keyPassword '123456'
            storeFile file('../../yshaw.jks')
            storePassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.yshaw
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.yshaw
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true // 默认关闭了BuildConfig生成，需要手动开启
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    applicationVariants.all { variant ->
        def buildTime = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('GMT+08:00'))
        variant.outputs.each { output ->
            output.outputFileName = "MyPrinter-${versionName}-${versionCode}-${output.baseName}-${buildTime}.apk"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

